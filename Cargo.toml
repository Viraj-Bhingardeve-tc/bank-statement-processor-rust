[package]
name    = "bank-statement-processor"
version = "0.1.0"
edition = "2021"
authors = ["A S Havaldar"]
description = "Bank Statement Processor — Rust + Slint"

# Phase 4A (PHASE4_DESIGN.md §1.1): `protocol` is a standalone shared-types
# crate for the future licensing server, kept out of this package's own
# dependency graph — listing it here only so `cargo build --workspace`/IDEs
# resolve it, not so every `cargo build` at this root pulls it in (Cargo's
# default-run-set for a mixed [package]+[workspace] manifest is the root
# package alone, unless `--workspace` is passed).
[workspace]
members  = ["protocol"]
resolver = "2"

[[bin]]
name = "bank-statement-processor"
path = "src/main.rs"

# Library target exposes the parser (+ future engines) for unit testing without
# pulling in the Slint UI dependency chain.
[lib]
name = "bank_statement_processor"
path = "src/lib.rs"

# ── UI ────────────────────────────────────────────────────────────────────────
[dependencies]
slint = { version = "1.7", optional = true }

# ── Native file dialog (Phase 4) ─────────────────────────────────────────────
rfd = { version = "0.15", optional = true }

# ── Database ─────────────────────────────────────────────────────────────────
# bundled-sqlcipher = statically-compiled SQLCipher (encrypted SQLite), linked
# dynamically against an existing OpenSSL libcrypto found via OPENSSL_DIR (see
# .cargo/config.toml) — no vendored OpenSSL build, no Perl required. The build
# output depends on libcrypto-3-x64.dll at runtime; see src/db/encryption.rs
# for the exact packaging requirement.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# ── Authentication ────────────────────────────────────────────────────────────
hmac    = "0.12"
sha2    = "0.10"
base64  = "0.22"

# ── Date / Time ───────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Serialisation ────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow   = "1"
thiserror = "1"

# ── Logging ──────────────────────────────────────────────────────────────────
log        = "0.4"
env_logger = "0.11"

# ── Regex (narration patterns, bank detection — Phase 3+) ────────────────────
regex    = "1"
once_cell = "1"

# ── Async runtime (AI HTTP calls — Phase 8+) ─────────────────────────────────
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

# ── HTTP client (AI classifier — Phase 8+) ───────────────────────────────────
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }

# ── XML export (Tally TDML — Phase 8+) ───────────────────────────────────────
quick-xml = { version = "0.36", features = ["serialize"] }

# ── CSV export (Zoho / QB / Odoo — Phase 8+) ────────────────────────────────
csv = "1"

# ── Excel reading (Phase 3+) ─────────────────────────────────────────────────
calamine = { version = "0.24", features = ["dates"] }

# ── Excel writing (Phase 8+) ─────────────────────────────────────────────────
umya-spreadsheet  = { version = "2", optional = true }
rust_xlsxwriter   = "0.95"

# ── PDF text extraction (Phase 3+) ───────────────────────────────────────────
# Note: lopdf gives raw text content. X/Y layout positions require pdfium-render
# (added in Phase 3 when PDF column detection is implemented).
lopdf = "0.33"

# ── Parallel processing (batch — Phase 9+) ───────────────────────────────────
rayon = "1"

# ── OS credential store + key generation (secrets/encryption at rest) ───────
keyring = "4.1.2"
rand    = "0.10.1"

# ── Features ─────────────────────────────────────────────────────────────────
[features]
# "slint-ui" gates the entire Slint + window subsystem.
# Use `--no-default-features` to run parser unit tests without compiling Slint.
default      = ["slint-ui", "ai"]
slint-ui     = ["dep:slint", "dep:slint-build", "dep:rfd"]
ai           = ["dep:reqwest"]
excel-export = ["dep:umya-spreadsheet"]

# ── Build dependencies ────────────────────────────────────────────────────────
[build-dependencies]
slint-build = { version = "1.7", optional = true }

# ── Profile ───────────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto       = true
strip     = true

[profile.dev]
opt-level = 0
# Line-tables-only (not full debug info): this binary's link step was
# crashing MSVC link.exe with an out-of-memory / stack-buffer-overrun on a
# resource-constrained dev machine (~5GB free RAM, disk >90% full). Full
# debug info (`debug = true`/2) makes the linker hold far more symbol data
# than line-table info (`debug = 1`), which is enough for panic backtraces
# but dramatically lighter to link. Trades some debugger fidelity for a
# build that reliably completes.
debug     = 1
# Disabled: the incremental cache for this binary (Slint + ~30 deps) grows
# to multiple GB across a handful of rebuilds, which doesn't fit on a
# constrained dev disk. Trades faster rebuilds for flat disk usage.
incremental = false
