[package]
name        = "license-server"
version     = "0.1.0"
edition     = "2021"
description = "Phase 4 licensing + payment server — see PHASE4_DESIGN.md. Phase 4F scope: payment domain, Razorpay client abstraction, POST /create-checkout-session, POST /webhooks/razorpay with HMAC verification and idempotent processing. No automatic reconciliation job/desktop changes."
publish     = false

[[bin]]
name = "license-server"
path = "src/main.rs"

[lib]
name = "license_server"
path = "src/lib.rs"

[dependencies]
# ── Web framework ─────────────────────────────────────────────────────────
axum = "0.7"

# ── Async runtime ────────────────────────────────────────────────────────
# "signal" is Phase 4I.1's graceful-shutdown hook (`tokio::signal::ctrl_c`/
# `unix::signal`) — main.rs's shutdown future needs it to notice
# Ctrl+C/SIGTERM instead of only stopping on a hard process kill.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# ── Logging (Phase 4I.1 — PHASE4_DESIGN.md §8.3 "Logging") ─────────────────
tracing            = "0.1"
# "json" turns on `fmt().json()` for release-mode structured logs (main.rs);
# debug builds use the default `.pretty()` formatter instead.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# HTTP request logging + request-id propagation (`lib.rs::build_router`) —
# already present transitively via `reqwest`'s own dependency tree; this
# makes it a direct dependency with just the two features actually used.
tower-http = { version = "0.6", features = ["trace", "request-id"] }

# ── Serialisation (response bodies) ─────────────────────────────────────────
serde = { version = "1", features = ["derive"] }

# ── Database (PHASE4_DESIGN.md §7) ───────────────────────────────────────────
# rustls (not native-tls) so this crate never needs the desktop app's
# OPENSSL_DIR/system-OpenSSL setup (.cargo/config.toml) — a self-contained
# pure-Rust TLS stack, independent build story from the desktop package.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    # `sqlx::migrate!()` is a proc macro shipped in sqlx-macros, gated by
    # this feature — "migrate" alone only pulls in the runtime `Migrator`/
    # `MigrateError` types, not the macro that embeds `migrations/` at
    # compile time. No compile-time-checked queries (`sqlx::query!`) are
    # used anywhere in this phase, so this doesn't require a live database
    # at build time.
    "macros",
    "chrono",
    "uuid",
    # `payment_webhook_events.payload JSONB` (PHASE4_DESIGN.md §7) maps to
    # `serde_json::Value` via this feature.
    "json",
] }

# ── Domain types ──────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid   = { version = "1", features = ["v4", "serde"] }
# Promoted from dev-dependencies: `PaymentWebhookEvent::payload` is a real
# `serde_json::Value` field in production code now, not just a test tool.
serde_json = "1"

# ── Dyn-compatible async traits (repository/service interfaces) ─────────────
# Native `async fn` in traits isn't object-safe yet, and `Arc<dyn
# LicenseRepository>` (so services depend on the trait, never a concrete
# `Pg*` type — PHASE4_DESIGN.md §1.2) needs a trait object. Standard fix.
async-trait = "0.1"

# ── Shared wire types (PHASE4_DESIGN.md §1.1) ────────────────────────────────
# Same DTOs `src/license/client.rs`'s desktop-side `HttpLicenseClient` will
# eventually use — request/response shape can't drift between the two
# independently, it's a compile error instead.
license-protocol = { path = "../protocol" }

# ── Authentication (PHASE4_DESIGN.md §1.3/§6) ────────────────────────────────
# Argon2 for `users.password_hash` — current OWASP-recommended KDF, and
# explicitly not the desktop's HMAC-based `auth::monthly_password` scheme
# (a different threat model — server-side account passwords need real
# credential-storage hygiene). Default features pull in the `password-hash`
# crate + an `OsRng` re-export, no separate dependency needed for salting.
argon2 = "0.5"
# High-entropy session tokens (256-bit, hex-encoded) — a separate `rand`
# from argon2's own internal `rand_core` re-export, used directly for
# `sessions.token_hash` generation.
rand = "0.8"
# SHA-256 for hashing session tokens at rest — same crate the desktop
# already uses for its own `auth::monthly_password` (no new algorithm
# choice introduced, just reused server-side for a different value).
sha2 = "0.10"

# ── Payments (PHASE4_DESIGN.md §2/§4) ────────────────────────────────────────
# Razorpay webhook signature verification — same crate pairing
# (hmac + sha2) already used desktop-side (`auth/monthly_password.rs`) and
# server-side for session tokens, so no new crypto primitive enters the
# tree just for this.
hmac = "0.12"
# Async Razorpay API calls (order/payment-link/subscription creation) —
# `reqwest` (async), matching PHASE4_DESIGN.md §1.3's stated choice; the
# desktop app uses reqwest's `blocking` feature for the same crate family,
# this crate uses the async variant since it's already tokio-based.
reqwest = { version = "0.12", features = ["json"] }

# ── Middleware composition ───────────────────────────────────────────────────
# `ServiceBuilder` — used in `lib.rs::build_router` to compose the
# request-id/tracing layers in an explicit, documented order. Promoted from
# dev-dependencies (was test-only, via `tower::ServiceExt::oneshot`) now that
# production code depends on it too.
tower = { version = "0.5", features = ["util"] }
