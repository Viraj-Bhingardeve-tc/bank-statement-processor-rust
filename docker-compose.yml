# Production deployment for the licensing server
# (PHASE4_DESIGN.md §8 — VPS + Docker Compose + Caddy + Postgres).
#
# Usage:
#   1. cp server/.env.example server/.env   # fill in real values, never commit
#   2. export POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (or put them in
#      a repository-root .env — docker compose loads that automatically).
#      POSTGRES_USER is the Postgres *instance superuser* the official
#      image bootstraps (administration only — running migrations,
#      `pg_dump`/`psql` in server/deploy/backup.sh|restore.sh, and creating
#      the restricted application role below); it must NOT be the role
#      `DATABASE_URL` in server/.env connects as day-to-day.
#   3. Set APP_DB_USER / APP_DB_PASSWORD (same place as step 2) and run
#      server/deploy/set-app-db-password.sh once the `postgres` service is
#      up and migrations have applied — this sets the password for the
#      restricted `license_server_app` role that migration
#      0003_least_privilege_app_role.sql creates. Point server/.env's
#      DATABASE_URL at THIS role, not POSTGRES_USER, once the password is
#      set (Phase 4J.8 — production readiness audit; see server/README.md's
#      "Database roles and least privilege" section for the full sequencing).
#   4. Edit Caddyfile: replace the placeholder domain with your real one,
#      and point that domain's DNS at this VPS (server/README.md's
#      "DNS requirements" / "First deployment" sections)
#   5. docker compose up -d --build
#
# Only `caddy` publishes ports to the host (80/443) — `license-server` and
# `postgres` are reachable only over the internal `licensing` network, never
# bound to the host's public interface (PHASE4_DESIGN.md §8.1: "a
# misconfiguration can't accidentally expose Postgres or the raw axum port
# to the internet — the network topology enforces it, not just a firewall
# rule someone could forget").

services:
  caddy:
    # `:2` tracks the latest stable Caddy 2.x release (not a moving
    # `latest` tag that could jump an unannounced major version); `-alpine`
    # keeps the runtime image small, same reasoning as license-server's own
    # slim runtime stage (server/Dockerfile).
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own state: issued certificates + ACME account (`caddy_data`)
      # and its running config (`caddy_config`) — named volumes so
      # `docker compose down` (without `-v`) never re-triggers certificate
      # issuance (and risks Let's Encrypt's rate limits) on the next start.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Production Hardening, Finding H6: was `- license-server` (only
      # "started", never "actually answering HTTP") — Caddy could begin
      # proxying to a container that had merely been launched, not one
      # that had finished migrating and bound its listener yet. Now waits
      # for the same `HEALTHCHECK` `server/Dockerfile` bakes into the
      # image (`GET /healthz`) to report healthy first.
      license-server:
        condition: service_healthy
    networks:
      - licensing

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # The instance superuser the official image bootstraps on first
      # init — administration only (see the usage comment at the top of
      # this file). Defaults to the conventional `postgres` admin name,
      # not an app-sounding one, so it's never mistaken for the role
      # `license-server` itself connects as (Phase 4J.8).
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (shell env or a repository-root .env) before starting}
      POSTGRES_DB: ${POSTGRES_DB:-license_server}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-license_server}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - licensing

  license-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - server/.env
    # Reachable at license-server:8080 from other containers on the
    # `licensing` network (Caddy's reverse_proxy target — see Caddyfile);
    # deliberately NOT published to the host (see the network-topology note
    # above).
    expose:
      - "8080"
    networks:
      - licensing

networks:
  licensing:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
