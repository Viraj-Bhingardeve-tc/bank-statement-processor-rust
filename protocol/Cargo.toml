[package]
name        = "license-protocol"
version     = "0.1.0"
edition     = "2021"
description = "Shared wire types (request/response DTOs, error codes) for the licensing client/server boundary. No I/O, no business logic — see PHASE4_DESIGN.md §1.1."
publish     = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
