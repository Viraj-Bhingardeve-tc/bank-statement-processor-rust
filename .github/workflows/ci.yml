name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # rusqlite's "bundled-sqlcipher" feature (desktop crate, src/db/encryption.rs)
  # needs an OpenSSL dev kit to link SQLCipher's crypto calls against.
  # .cargo/config.toml's own [env] default (OPENSSL_DIR) points at a
  # Windows-only PostgreSQL install path and applies whenever OPENSSL_DIR
  # isn't already set in the process environment — that file's own comment
  # says explicitly to override it here on CI runners instead of relying on
  # it. Ubuntu's libssl-dev (installed below) lays out headers/libs under
  # the multiarch path below, not a single combined $OPENSSL_DIR/{include,lib}
  # tree, so both the combined and split forms are set: OPENSSL_DIR as a
  # defensive fallback (its mere presence stops the Windows default from
  # being injected at all), OPENSSL_LIB_DIR/OPENSSL_INCLUDE_DIR as the
  # precise paths libsqlite3-sys's build script actually needs on Linux.
  OPENSSL_DIR: /usr
  OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
  OPENSSL_INCLUDE_DIR: /usr/include

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Desktop crate needs Slint's UI toolkit deps (fontconfig, xkbcommon,
      # XCB) and rfd's native file-dialog deps (GTK3) to link, even though
      # no display is ever opened in CI; the server crate's own TLS stack
      # (sqlx's runtime-tokio-rustls) needs none of this, only the desktop
      # crate's SQLCipher linkage does.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      # --workspace: this repo's root Cargo.toml is both a package and a
      # workspace root (members = ["protocol", "server"]) — Cargo's default
      # run-set for that shape is the root package alone (see that file's
      # own comment), so omitting --workspace here would silently skip
      # linting the licensing/payment server and shared protocol crates
      # entirely.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      # --workspace: see the clippy job's comment above — without it this
      # would only run the desktop crate's tests and silently skip the
      # server and protocol crates entirely.
      - run: cargo test --workspace --all-features

  # Production Hardening, Finding H7: the `test` job above only runs
  # license-server's default (non-#[ignore]d) tests — every test needing a
  # real Postgres is `#[ignore]`d (server/README.md's "Tests" section) and
  # was, before this job, never executed automatically at all. This job
  # starts a real Postgres as a GitHub Actions service (not Docker
  # Compose — this repo's docker-compose.yml is a production-deployment
  # topology with Postgres unpublished to the host, not a CI fixture), waits
  # for it to report healthy, then runs that full ignored suite against it.
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The GitHub Actions Postgres service creates this database
          # automatically on container startup — no separate "create the
          # test database" step needed.
          POSTGRES_DB: license_server_test
        ports:
          - 5432:5432
        # GitHub Actions blocks the job's own steps from starting until
        # this reports healthy, polling `pg_isready` itself — this is what
        # satisfies "wait until healthy", no hand-rolled wait loop needed.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Postgres's `postgres` superuser, not the restricted
      # `license_server_app` role migration 0003 creates — this suite
      # (`tests/least_privilege_role.rs` in particular) needs an
      # admin-level account to apply migrations and grant/inspect that
      # restricted role's privileges. No hardcoded credentials appear in
      # any Rust source — this is the only place the connection string is
      # assembled, as a workflow-level environment variable.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/license_server_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: db-tests

      # `-p license-server`: this crate's own tests are the only ones
      # gated behind a real Postgres — the desktop crate's `#[ignore]`d
      # tests (tests/import_pipeline.rs) document unrelated, pre-existing
      # PDF-extraction bugs and must not be swept up by a bare
      # `--workspace -- --ignored`. Scoping to `-p license-server` also
      # means this job never needs the desktop crate's Slint/GTK system
      # dependencies (see the clippy/test jobs above) — sqlx here links
      # against rustls, not OpenSSL, so this job needs nothing beyond the
      # stable toolchain.
      - name: Run Postgres-backed integration tests
        run: bash server/scripts/run-db-tests.sh
